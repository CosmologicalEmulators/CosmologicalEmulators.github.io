name: Documentation hub

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: julia-actions/cache@v2
        with:
          delete-old-caches: "false"
      - name: Install build dependencies
        run: julia --startup-file=no --project="$GITHUB_WORKSPACE" -e 'using Pkg; Pkg.instantiate()'
      - name: Aggregate documentation
        run: julia --startup-file=no --project="$GITHUB_WORKSPACE" make.jl
      - name: Validate aggregate
        run: python3 test_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation hub
        id: deployment
        uses: actions/deploy-pages@v4
