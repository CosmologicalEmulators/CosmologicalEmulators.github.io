# Order also defines navigation order. Do not add an unpublished version.
[[packages]]
name = "AbstractCosmologicalEmulators.jl"
repo = "AbstractCosmologicalEmulators.jl"
path = "ace"
versions = ["dev"]
description = "Shared emulator interfaces, interpolation, AD and analytic backgrounds."

[[packages]]
name = "Capse.jl"
repo = "Capse.jl"
path = "capse"
versions = ["stable", "dev"]
description = "CMB angular power spectrum emulators."

[[packages]]
name = "Mapse.jl"
repo = "Mapse.jl"
path = "mapse"
versions = ["stable", "dev"]
description = "Matter power spectrum emulators and nonlinear prescriptions."

[[packages]]
name = "Effort.jl"
repo = "Effort.jl"
path = "effort"
versions = ["stable", "dev"]
description = "Effective-field-theory large-scale-structure emulators."

[[packages]]
name = "EmulatorsTrainer.jl"
repo = "EmulatorsTrainer.jl"
path = "trainer"
versions = ["stable", "dev"]
description = "Dataset generation, emulator training, validation and artifacts."

